summary: >-
  Declares file message loggers in Spring Boot properties.
production:
  - >-
    Declare the instance in the profile file of each environment that uses it, not in application.properties, which
    every profile reads.
  - >-
    Take log-directory from an environment variable.
failures:
  - symptom: >-
      The start fails: staffix.messages-loggers-file.instances.<key>.log-directory is required.
    fix: >-
      Set it under the application's data directory.
  - symptom: >-
      The start fails: staffix.messages-loggers-file.instances.<key> collides with another logger contributor for the
      same key.
    fix: >-
      Two modules declare an instance under the same key in the active profiles. application.properties applies in every
      profile: declare each environment's instance in its own profile file, or give it another key.
