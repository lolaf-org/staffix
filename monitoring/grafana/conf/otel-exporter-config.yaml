receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  # the file messages logger with the logfmt line format: the head before the first " - " outside quotes is logfmt
  filelog/staffix:
    include: [ /var/log/staffix/*.log ]
    start_at: beginning
    resource:
      service.name: staffix-file-logger
    operators:
      - type: regex_parser
        regex: '^(?P<head>(?:"(?:[^"\\]|\\.)*"|[^"])*?) - (?P<message>.*)$'
      - type: key_value_parser
        parse_from: attributes.head
        delimiter: "="
        pair_delimiter: " "
      - type: time_parser
        parse_from: attributes.time
        layout_type: gotime
        layout: 2006-01-02T15:04:05.999999999Z07:00
      - type: move
        from: attributes.message
        to: body
      # the session's attributes go to the resource, where the OTLP messages logger puts them
      - type: move
        from: attributes["fix.eid"]
        to: resource["fix.eid"]
      - type: move
        from: attributes["fix.iid"]
        to: resource["fix.iid"]
      - type: move
        from: attributes["fix.sg"]
        to: resource["fix.sg"]
      - type: move
        from: attributes["fix.sn"]
        to: resource["fix.sn"]
      - type: remove
        field: attributes.head
      - type: remove
        field: attributes.time
processors:
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  prometheus:
    endpoint: 0.0.0.0:4319
    send_timestamps: true
    metric_expiration: 180m
    enable_open_metrics: true
    translation_strategy: "UnderscoreEscapingWithoutSuffixes"
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    headers:
      x-scope-orgid: tenant-1
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp/tempo ]
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheus ]
    logs:
      receivers: [ otlp, filelog/staffix ]
      processors: [ batch ]
      exporters: [ otlphttp ]