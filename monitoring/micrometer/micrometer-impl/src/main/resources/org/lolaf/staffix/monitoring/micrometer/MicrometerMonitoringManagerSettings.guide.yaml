summary: >-
  Session metrics published to a MeterRegistry the application supplies, such as the Prometheus one it exposes. Pick it
  when the application already has a registry; for a collector, use the OTLP variant.
production:
  - >-
    Supply the registry with meterRegistrySupplier.
  - >-
    Enable only the timers needed: each costs a measurement on the message path.
  - >-
    Put it behind the async plugin to keep the timers off the message path.
  - >-
    Alert on the session.logon.status gauge: 0 is logged out inside session time.
behaviour:
  - >-
    The manager never closes the registry it is given: in plain Java, close it after the engine stops, or pass
    MeterRegistry::close as stoppingMeterRegistryConsumer for a last publish that still reports the sessions just
    destroyed; with Spring Boot, the context closes the bean.
