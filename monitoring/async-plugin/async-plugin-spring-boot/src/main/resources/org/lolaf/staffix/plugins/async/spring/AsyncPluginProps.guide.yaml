summary: >-
  Declares async plugin wrappers in Spring Boot properties, each wrapping a monitoring or tracing plugin declared by
  another module.
production:
  - >-
    Declare the wrapper beside the plugin it wraps, under its own key, and point at that plugin with wraps=<key>, for
    example an entry of staffix.monitoring.otlp.instances or staffix.tracing.otel.instances. In Java the wrapper holds
    the wrapped settings instead.
  - >-
    Sessions keep naming the wrapped plugin's key.
failures:
  - symptom: >-
      The start fails: staffix.async-plugin.instances.<key>.wraps is required.
    fix: >-
      Set wraps to the key of the plugin to wrap.
  - symptom: >-
      The start fails: staffix.async-plugin.instances.<key>.wraps='<id>' does not reference any sessions plugin.
    fix: >-
      The wrapped plugin's module is missing from the dependencies, its key differs, or it is declared in a profile that
      is not active.
