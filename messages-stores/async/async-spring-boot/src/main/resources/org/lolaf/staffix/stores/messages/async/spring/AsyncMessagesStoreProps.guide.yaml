summary: >-
  Declares async store wrappers in Spring Boot properties, each wrapping a store declared by another store module.
production:
  - >-
    Declare the wrapper beside the store it wraps, under its own key, and point at that store with wraps=<key>, for
    example an entry of staffix.messages-stores-jdbc.instances. In Java the wrapper holds the wrapped settings instead.
  - >-
    Sessions keep naming the wrapped store's key.
failures:
  - symptom: >-
      The start fails: staffix.messages-stores-async.instances.<key>.wraps is required.
    fix: >-
      Set wraps to the key of the store to wrap.
  - symptom: >-
      The start fails: staffix.messages-stores-async.instances.<key>.wraps='<id>' does not reference any store.
    fix: >-
      The wrapped store's module is missing from the dependencies, its key differs, or it is declared in a profile that
      is not active.
  - symptom: >-
      The start fails: staffix.messages-stores-async.instances.<key>.async-queue-directory is required.
    fix: >-
      Set it under the application's data directory, from an environment variable.
