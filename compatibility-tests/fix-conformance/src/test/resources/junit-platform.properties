# Conformance scenarios are slow: each one drives a real initiator/acceptor pair over a socket, so the suite is
# dominated by waiting rather than by CPU. Running the ScenarioNN classes concurrently takes the suite from about
# 70s to about 25s.
#
# Classes run concurrently, methods within a class stay on the same thread: the scenarios share mutable per-test
# state through AbstractScenario (sessions, mocks, message stores) and several of them assert on sequence numbers
# that only make sense when the methods of a class run one after the other.
#
# This is only safe because AbstractScenario picks a free acceptor port per test instead of a fixed one.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
