spring.application.name=fix-client
spring.profiles.default=dev

staffix.enabled=true

staffix.sessions-settings-stores-memory.instances.default.sessions[0].type=initiator
staffix.sessions-settings-stores-memory.instances.default.sessions[0].fix-session-id.name=order-entry
staffix.sessions-settings-stores-memory.instances.default.sessions[0].fix-session-id.fix-version=VERSION_44
staffix.sessions-settings-stores-memory.instances.default.sessions[0].fix-session-id.sender-comp-id=${FIX_SENDER_COMP_ID:CLIENT}
staffix.sessions-settings-stores-memory.instances.default.sessions[0].fix-session-id.target-comp-id=${FIX_TARGET_COMP_ID:BROKER}
staffix.sessions-settings-stores-memory.instances.default.sessions[0].fix-application-instance-id=order-entry
# a profile file cannot override one entry of an indexed list, so what differs per profile goes through a property
staffix.sessions-settings-stores-memory.instances.default.sessions[0].reset-seq-num-on-logon=${fix-client.reset-seq-num-on-logon}

staffix.initiators.order-entry.instance-id=order-entry
staffix.initiators.order-entry.main-target.fix-session-id.name=order-entry
staffix.initiators.order-entry.main-target.fix-session-id.fix-version=VERSION_44
staffix.initiators.order-entry.main-target.fix-session-id.sender-comp-id=${FIX_SENDER_COMP_ID:CLIENT}
staffix.initiators.order-entry.main-target.fix-session-id.target-comp-id=${FIX_TARGET_COMP_ID:BROKER}
staffix.initiators.order-entry.main-target.connect-addresses[0]=${FIX_HOST:localhost}:${FIX_PORT:9876}
staffix.initiators.order-entry.connection-retry=5s
