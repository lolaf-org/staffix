# messages stored on file with synchronous writes, so a restart resumes the sequence numbers, and logged to file off
# the session thread; files go under STAFFIX_DATA_DIR
fix-client.reset-seq-num-on-logon=false
staffix.messages-stores-file.instances.default.storage-directory-path=${STAFFIX_DATA_DIR}/store
staffix.messages-loggers-file.instances.default.log-directory=${STAFFIX_DATA_DIR}/log
staffix.messages-loggers-async.instances.async-file.wraps=default
staffix.messages-loggers-async.instances.async-file.async-queue-directory=${STAFFIX_DATA_DIR}/log-queue
