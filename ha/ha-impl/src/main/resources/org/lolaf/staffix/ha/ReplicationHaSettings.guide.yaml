summary: >-
  Replicates the stores of the sessions whose haSessionSettings ask for it to a standby engine, which takes over when
  the leader election makes it the leader. Needs a leaderElection, and no implementation of one ships yet.
production:
  - >-
    Size logCapacity to the bytes the sessions write while a follower may lag or reconnect; a follower left further
    behind is caught up by snapshot, and no single message may exceed an eighth of it.
  - >-
    Size snapshotMaxMessages to the oldest message a counterparty may ask to be resent after a failover to a follower
    that was caught up by snapshot; older ones are gap filled.
  - >-
    Give both nodes the same peers and logCapacity: a node binds its own peers entry while it leads and connects to
    the leader's, and a follower sizes its receive buffer from logCapacity.
  - >-
    A node that becomes leader moves the outgoing sequence number of every replicated session ahead by
    promotionOutgoingSeqNumJump, so the counterparty sees a gap it fills with a resend request answered by a gap fill,
    rather than a number lower than the old leader's, which it would refuse. Size it above what a session sends
    while unreplicated.
