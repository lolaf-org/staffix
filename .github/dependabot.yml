version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

    # Without grouping this is two dozen pinned versions arriving one pull request at a time
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.sonatype.central:*"
          - "com.mycila:license-maven-plugin"
          - "org.projectlombok:lombok-maven-plugin"
      test-libraries:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.awaitility:*"
      # What staffix is measured and tested against: JMH, and the two engines the benchmarks and the
      # compatibility tests run beside it. Nothing published depends on them, so they move together.
      # net.openhft is deliberately not here: chronicle-queue is a compile dependency of the published
      # staffix-messages-core-async, so its updates arrive on their own.
      benchmark-libraries:
        patterns:
          - "org.openjdk.jmh:*"
          - "org.quickfixj:*"
          - "uk.co.real-logic:*"

    # slf4j is held at 2.0.x deliberately.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "org.slf4j:*"
