name: Feature request
description: Something staffix should be able to do and cannot
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, not the solution - the shape of the workload usually decides the answer.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What staffix makes you do today
      description: Including the workaround you are using, if there is one.

  - type: textarea
    id: hotpath
    attributes:
      label: Is this on the message path
      description: >
        Staffix will not put work on the message path - parsing, encoding, the session callbacks - for a
        feature that only some sessions need; such a feature goes behind a setting that is off by default.
        If this belongs there, say what it would cost and why it is worth it.
