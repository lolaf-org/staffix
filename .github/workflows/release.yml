name: release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release, without a leading v (e.g. 0.9.0). Ignored when performOnly.'
        required: false
        type: string
      developmentVersion:
        description: 'Version to leave main on afterwards (e.g. 1.0.0-SNAPSHOT). Ignored when performOnly.'
        required: false
        type: string
      dryRun:
        description: 'Rehearse: build and verify only - no commit, no tag, no push, no upload'
        required: false
        default: false
        type: boolean
      # Recovery, not routine. If prepare pushed and perform then failed, the tag is real and only the
      # deployment is missing
      performOnly:
        description: 'Skip prepare and deploy an existing tag (set tag below)'
        required: false
        default: false
        type: boolean
      tag:
        description: 'Tag to deploy when performOnly (e.g. v0.9.0)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: lolaf-org/workflows/.github/workflows/maven-release.yml@v1.1.1
    with:
      release-version: ${{ inputs.releaseVersion }}
      development-version: ${{ inputs.developmentVersion }}
      dry-run: ${{ inputs.dryRun }}
      perform-only: ${{ inputs.performOnly }}
      tag: ${{ inputs.tag }}
      timeout-minutes: 120
    secrets: inherit

  claude-plugin:
    needs: release
    if: ${{ !inputs.dryRun }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.performOnly && inputs.tag || format('v{0}', inputs.releaseVersion) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Build the plugin zip and its marketplace.json
        run: ./mvnw -B package -pl claude-plugin-archive -am -DskipTests

      - name: Attach them to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            claude-plugin-archive/target/staffix-claude-plugin-*.zip \
            claude-plugin-archive/target/marketplace.json
