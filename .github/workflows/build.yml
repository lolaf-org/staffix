name: build

on:
  push:
    branches: [ main ]
  pull_request:

# A superseded run on a pull request is not worth runner minutes, but every commit landing on main gets verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Reports the check `build / build`, which is what branch protection on main requires.
  build:
    uses: lolaf-org/workflows/.github/workflows/maven-build.yml@v1.0.2
    with:
      # a full build measured 14:19 locally; runners are slower and pull container images, hence the generous ceiling
      timeout-minutes: 60
