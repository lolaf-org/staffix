# Initiator-side session: INITIATOR_1 -> ACCEPTOR.
# fixVersion, group, instance ids and heartbeat are inherited from default.yaml.
#
# The id shows a partial placeholder: only part of the value is substituted, and the
# default after the second colon is empty, so unset it reads "initiator1" and
# `-Dstaffix.example.initiator.prefix=uat-` makes it "uat-initiator1". The id labels
# the session locally - the acceptor pairs on senderCompID/targetCompID - so prefixing
# it does not have to be matched on the other side.
# yaml-language-server: $schema=../fix-session-settings.v1.schema.json
fixSessionId:
  id: "${sysprop:staffix.example.initiator.prefix:}initiator1"
  senderCompID: "INITIATOR_1"
  targetCompID: "ACCEPTOR"