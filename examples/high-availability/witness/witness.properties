# The example's witness: one cluster, configured in applications/, on localhost.
bind.host=127.0.0.1
bind.port=7420
# Resolved against this directory. Wiped by mvn clean, as are the nodes' terms and votes beside it.
state.directory=../target/witness/data
config.source=file
secret.example.value=an-example-secret-change-it
timings.profile=lan
vote.logging=true
reload.rescan.seconds=5
