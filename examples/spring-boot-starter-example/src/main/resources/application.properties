spring.main.banner-mode=off
management.endpoints.web.exposure.include=fix-sessions,health,info
management.endpoints.access.default=unrestricted
management.endpoint.health.show-details=always
staffix.enabled=true
staffix.actuator.enabled=true
staffix.actuator.fix-session-state-contributes-to-heath-status=true
staffix.admin-api-jmx.domain=org.lolaf.staffix.example
# --- Sessions: one acceptor-side session and one initiator-side session ---
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].type=acceptor
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-session-id.id=acceptor-session-1
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-session-id.fix-version=VERSION_44
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-session-id.sender-comp-id=ACCEPTOR
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-session-id.target-comp-id=INITIATOR_1
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-session-id.group=test-group
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-message-store-instance-id=ACCEPTOR
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-message-logger-instance-id=ACCEPTOR
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].fix-application-instance-id=acceptorApp
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[0].reset-seq-num-on-logon=true
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].type=initiator
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].fix-session-id.id=initiator-session-1
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].fix-session-id.fix-version=VERSION_44
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].fix-session-id.sender-comp-id=INITIATOR_1
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].fix-session-id.target-comp-id=ACCEPTOR
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].fix-message-store-instance-id=INITIATOR
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].fix-message-logger-instance-id=INITIATOR
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].fix-application-instance-id=initiatorApp
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].reset-seq-num-on-logon=true
staffix.sessions-settings-stores-memory.instances.SHARED.sessions[1].heartbeat.initiator-interval=2s
# --- Per-instance message stores and loggers ---
staffix.messages-stores-memory.instances.ACCEPTOR.max-entries-in-memory=1024
staffix.messages-stores-memory.instances.INITIATOR.max-entries-in-memory=1024
staffix.messages-loggers-slf4j.instances.ACCEPTOR.message-fields-delimiter=|
staffix.messages-loggers-slf4j.instances.INITIATOR.message-fields-delimiter=|
# --- Acceptor: bind a TCP listener and accept sessions from acceptor-store ---
staffix.acceptors.primary.instance-id=ACCEPTOR
staffix.acceptors.primary.scheduler-bean=staffixScheduler
staffix.acceptors.primary.bind-address=localhost:17001
staffix.acceptors.primary.target-sessions-settings-store-instance-ids[0]=SHARED
staffix.acceptors.primary.io-workers.thread-groups[0].name=default
staffix.acceptors.primary.io-workers.thread-groups[0].io-thread-count=1
staffix.acceptors.primary.io-workers.thread-groups[0].select-strategy=WAKEUP
staffix.acceptors.primary.message-executor.executors-threads-count=1
staffix.acceptors.primary.message-executor.idle-strategy=WAIT_NOTIFY
# --- Initiator: connect to the acceptor ---
staffix.initiators.primary.instance-id=INITIATOR_1
staffix.initiators.primary.scheduler-bean=staffixScheduler
staffix.initiators.primary.fix-session-id.id=initiator-session-1
staffix.initiators.primary.fix-session-id.fix-version=VERSION_44
staffix.initiators.primary.fix-session-id.sender-comp-id=INITIATOR_1
staffix.initiators.primary.fix-session-id.target-comp-id=ACCEPTOR
staffix.initiators.primary.connect-addresses[0]=localhost:17001
staffix.initiators.primary.connection-retry=PT1S
staffix.initiators.primary.io-workers.thread-groups[0].name=default
staffix.initiators.primary.io-workers.thread-groups[0].io-thread-count=1
staffix.initiators.primary.io-workers.thread-groups[0].select-strategy=WAKEUP
staffix.initiators.primary.message-executor.executors-threads-count=1
staffix.initiators.primary.message-executor.idle-strategy=WAIT_NOTIFY
# --- Async plugin wrapper (staffix-monitoring-async-plugin-spring-boot) ---
# Defers a sessions plugin's fire-and-forget callbacks onto a dedicated consumer thread pool, off the
# latency-critical path. 'wraps' must reference the instance-id key of another sessions-plugin
# contributor (e.g. a staffix.monitoring-micrometer.instances.<key> or staffix.tracing.otel.instances.<key>
# entry). Uncomment once such a plugin is configured:
#staffix.async-plugin.instances.md.wraps=md
#staffix.async-plugin.instances.md.queue-size=2048
#staffix.async-plugin.instances.md.consumer-thread-pool-size=1
#staffix.async-plugin.instances.md.backpressure-policy=DROP
# --- Throttling plugin wrapper (staffix-monitoring-throttling-plugin-spring-boot) ---
# Rate-limits (samples) a wrapped sessions plugin's per-message callbacks so the delegate is not
# overwhelmed at peak throughput. 'wraps' references another sessions-plugin instance-id key; max-*-messages
# of 0 (or unset) disables that direction. Uncomment once such a plugin is configured:
#staffix.throttling-plugin.instances.md.wraps=md
#staffix.throttling-plugin.instances.md.max-received-messages=1000
#staffix.throttling-plugin.instances.md.max-sent-messages=1000
#staffix.throttling-plugin.instances.md.window=1s
