# The session options a migration meets less often
[DEFAULT]
HeartBtInt=20
TimeZone=America/New_York

[SESSION]
ConnectionType=initiator
BeginString=FIX.4.3
SenderCompID=CLIENT
SenderSubID=desk
TargetCompID=BROKER
SessionQualifier=alt
SocketConnectHost=broker.example.com
SocketConnectPort=4000
ReconnectInterval=5x3;30
NonStopSession=Y
ResetOnLogon=Y
ClosedResendInterval=Y
TimeStampPrecision=MICROS
LogonTimeout=30
LogoutTimeout=5
UseDataDictionary=N
CheckCompID=N
MaxLatency=30
EnableNextExpectedMsgSeqNum=Y
SocketUseSSL=Y
SocketTrustStore=keys/trust.p12
TrustStoreType=PKCS12
SocketTrustStorePassword=${TRUST_PASSWORD}
EnabledProtocols=TLSv1.3,TLSv1.2
SocketTcpNoDelay=Y
ResendRequestChunkSize=100

[SESSION]
ConnectionType=acceptor
BeginString=FIX.4.4
SenderCompID=BROKER
TargetCompID=CLIENT
SocketAcceptAddress=127.0.0.1
SocketAcceptPort=4000
AllowedRemoteAddresses=10.0.0.1, 10.0.0.2
StartTime=09:30:00
EndTime=16:00:00
Weekdays=Mon,Tue,Wed,Thu,Fri
ValidateFieldsOutOfOrder=N
TimeStampPrecision=SECONDS
